gui:
  showRandomTip: false
  nerdFontsVersion: '3'
  sidePanelWidth: 0.2
  border: 'single'
  mainPanelSplitMode: 'vertical'
  useHunkModeInStagingView: false

git:
  diffRenderers:
    - command: 'delta --dark --paging=never'

notARepository: 'skip'

customCommands:
  - key: X
    description: 'Custom commands'
    commandMenu:
      - key: 'x'
        context: 'files'
        description: 'Just kept here in case I want to add custom commands in the future'
        command: 'echo "thats pretty neat"'
        output: 'terminal'
