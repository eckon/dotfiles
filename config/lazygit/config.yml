gui:
  showRandomTip: false
  nerdFontsVersion: '3'
  sidePanelWidth: 0.2
  border: 'single'
  mainPanelSplitMode: 'vertical'
  useHunkModeInStagingView: false

git:
  diffRenderers:
    - command: 'delta --dark --paging=never'

notARepository: 'skip'

customCommands:
  - key: 'X'
    description: 'Custom commands'
    commandMenu:
      - key: 'b'
        description: 'Start Jira branch'
        loadingText: 'Creating branch and empty commit...'

        prompts:
          - type: 'input'
            key: 'Issue'
            title: 'Jira ticket / scope:'

          - type: 'input'
            key: 'Type'
            title: 'Commit type:'

          - type: 'input'
            key: 'Description'
            title: 'Description:'

          - type: 'confirm'
            title: 'Create branch and empty commit?'
            body: |-
              The following will be created:

              Branch:
              {{ .Form.Issue }}_{{ runCommand (printf "/bin/bash -c 'printf \"%%s\" \"$1\" | tr \"[:upper:]\" \"[:lower:]\" | tr -cs \"[:alnum:]\" \"-\" | sed \"s/^-*//; s/-*$//\"' -- %s" (.Form.Description | quote)) }}

              Empty commit:
              {{ .Form.Type }}({{ .Form.Issue }}): {{ .Form.Description }}

              Continue?

        command: >-
          /bin/bash -c 'issue="$1"; type="$2"; description="$3"; slug="$(printf "%s" "$description" | tr "[:upper:]" "[:lower:]" | tr -cs "[:alnum:]" "-" | sed "s/^-*//; s/-*$//")"; branch="${issue}_${slug}"; git switch -c "$branch" && git commit --allow-empty --only -m "${type}(${issue}): ${description}"' --
          {{ .Form.Issue | quote }}
          {{ .Form.Type | quote }}
          {{ .Form.Description | quote }}

        output: log

      - key: 'c'
        description: 'Add commit to current Jira branch'
        loadingText: 'Creating commit...'

        prompts:
          - type: 'input'
            key: 'Type'
            title: 'Commit type:'

          - type: 'input'
            key: 'Description'
            title: 'Description:'

        command: >-
          /bin/bash -c 'branch="$1"; type="$2"; description="$3"; scope="${branch%%_*}"; git commit --allow-empty -m "${type}(${scope}): ${description}"' --
          {{ .CheckedOutBranch.Name | quote }}
          {{ .Form.Type | quote }}
          {{ .Form.Description | quote }}

        output: log
