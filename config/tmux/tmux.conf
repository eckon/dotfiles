# -------------------- General --------------------
unbind-key C-b
set-option -g  prefix C-a

# handle extended keys better, mainly for `pi` but might be nice for other parts as well
set-option -g extended-keys on
set-option -g extended-keys-format csi-u

# on double C-a send a default C-a to the program (nice for vim's C-a)
# also allows to use C-a on a server (inside of tmux client side)
bind-key   C-a send-prefix

# high values will use a lot of memory and lag scrolling/resizing of buffer
# 20k is a middle ground: noticeably more scrollback, but still cheap to reflow on resize
set-option -g  history-limit 20000
set-option -g  repeat-time   0
set-option -sg escape-time   10

# needed to allow vim to notice external change events inside tmux
set-option -g  focus-events on

# stay in tmux even if session is closed -> close session and jump into another one instead of being out of tmux
set-option -g detach-on-destroy off

# left mouse click drag (highlight area):
#   overwrite "copy and exit" to "copy and stay" (do not go to bottom of buffer)
set-option -g  mouse on
bind-key   -T  copy-mode-vi MouseDragEnd1Pane send -X copy-selection


# NOTE: these options are not needed with modern linux terminals, but left in for wsl etc.
# sync tmux default terminal for correct colors
set-option -sg terminal-overrides ",*:RGB"

# let programs send escape sequences directly to the terminal (e.g. images in neovim)
set-option -g allow-passthrough on

# adds colored undercurl support
set-option -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set-option -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'



# -------------------- Display --------------------
set-option -g allow-rename           off
set-option -g base-index             1
set-option -g pane-base-index        1
set-option -g renumber-windows       on
set-option -g set-titles             on
set-option -g set-titles-string      "#S / #W"
set-option -g pane-border-indicators off

set-option -g pane-border-style        fg=brightblack
set-option -g pane-active-border-style fg=brightblack


set-option -g status-style        fg=brightblack,bg=black
set-option -g status-position     top
set-option -g status-right-length 60
set-option -g status-left         ""
set-option -g status-right        "\
#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null | sed 's/.*/& /')\
#{?window_zoomed_flag,#[fg=yellow#,bold]󰊓 #[default],}\
#{?client_prefix,#[fg=white#,bg=red#,bold],#[fg=white#,bg=brightblack#,bold]} #S "


# hide default flags (`*` `-` `Z`), current window is highlighted and zoom is shown on the right
set-option -g window-status-format         "#I:#W "
set-option -g window-status-current-format "#I:#W "
set-option -g window-status-current-style  fg=white,bold



# -------------------- Navigation --------------------
# pane navigation and splitting
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# create window with current directory instead of default directory
bind-key c new-window      -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"



# -------------------- Special --------------------
# resource tmux config in a running session
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# open command palette (VSCode-like) for searching and executing predefined commands
bind-key Tab display-popup -EB -w 80% -h 60% "tmux-command-palette"

# jump and create tmux sessions based on dirs (previously custom `tmux-jump` script)
bind-key f run-shell "sesh connect \"$(sesh list --hide-attached | fzf-tmux -p 80%,70%)\""

# open git ui in a new window for quick commits etc. (keep it for quick access, otherwise use Tab binding above)
bind-key g run-shell "tmux-command-palette lazygit"

# open workmux dashboard in a new window (same command as in the palette above)
bind-key S run-shell "tmux-command-palette 'workmux dashboard --tab worktrees'"

# create a workmux worktree from a prompt (spaces become `-`, e.g. "fix login bug" -> fix-login-bug)
# input is split into words by `read -a` and joined with `-`
bind-key W display-popup -E -T " workmux add " -w 60 -h 3 -d "#{pane_current_path}" \
  'bash -c "read -rep \"> \" -a words; name=\$(IFS=-; echo \"\${words[*]}\"); [[ -z \$name ]] || workmux add \"\$name\""'

# kill all tmux panes except the current focused one (similar to vim ctrl-w o)
bind-key o kill-pane -a

# edit the current tmux pane in a vim buffer
bind-key e \
  run "tmux capture-pane -p -J -S - | sed -E 's/ +$//' > /tmp/tmux-buffer.log" \; \
  new-window "vim -c 'normal! G' /tmp/tmux-buffer.log"
