# Special
[tasks.check]
description = "Run all formatters and linters over the whole repo"
run = [
  { task = "scripts:format" },
  { task = "scripts:lint" },
  { task = "lua:format" },
  { task = "lua:lint" },
  { task = "markdown:format" },
  { task = "markdown:lint" },
  { task = "json:format" },
  { task = "toml:format" },
  { task = "yaml:format" },
]

[tasks.neovim]
description = "Force reinstall of latest neovim nightly release"
confirm = "This will overwrite neovim, are you sure?"
run = "./bootstrap/packages/install-neovim-appimage.sh --force"


# Setup tasks
[tasks.symlinks]
description = "Symlink all given configurations"
run = "./bootstrap/symlink.sh"

[tasks."symlinks:check"]
description = "Show what symlinking would change, without touching the disk"
run = "./bootstrap/symlink.sh --dry-run"

[tasks."packages:update"]
description = "Update all packages"
alias = "update"
run = ["sudo -v", "./bootstrap/update-packages.sh"]

[tasks."install:yay"]
description = "Install yay packages"
run = "./bootstrap/packages/install-packages-yay.sh"

[tasks."install:apt"]
description = "Install apt packages"
run = "./bootstrap/packages/install-packages-apt.sh"

[tasks."install:dnf"]
description = "Install dnf packages"
run = "./bootstrap/packages/install-packages-dnf.sh"

[tasks."install:brew"]
description = "Install brew packages"
run = "./bootstrap/packages/install-packages-brew.sh"

[tasks."install:fish"]
description = "Set fish as default shell"
run = "./bootstrap/packages/install-fish.sh"

[tasks."install:font"]
description = "Install FiraCode Nerd Font (for systems without a font package)"
run = "./bootstrap/packages/install-font.sh"

[tasks."install:neovim"]
description = "Install neovim nightly appimage, skipped if nvim exists"
run = ["sudo -v", "./bootstrap/packages/install-neovim-appimage.sh"]


# Lua tasks
[tasks."lua:format"]
description = "Format Lua files with stylua"
run = "stylua --glob '*.lua' ./config/nvim"

[tasks."lua:lint"]
description = "Lint Lua files with selene"
run = "selene config/nvim"


# Markdown tasks
[tasks."markdown:format"]
description = "Format Markdown files with rumdl"
run = "rumdl fmt --quiet ."

[tasks."markdown:lint"]
description = "Lint Markdown files with rumdl"
run = "rumdl check --quiet ."


# Config file tasks
[tasks."json:format"]
description = "Format JSON files with prettier"
run = "prettier --write --log-level warn '**/*.{json,jsonc}'"

[tasks."toml:format"]
description = "Format TOML files with taplo (settings in `.taplo.toml`)"
run = "taplo fmt"
env = { RUST_LOG = "warn" } # hide info logs

[tasks."yaml:format"]
description = "Format YAML files with prettier"
run = "prettier --write --log-level warn '**/*.{yaml,yml}'"


# Scripts tasks
[tasks."scripts:format"]
description = "Format shell scripts with shfmt (settings in `.editorconfig`)"
run = "shfmt --write ."

[tasks."scripts:lint"]
description = "Lint shell scripts with shellcheck"
run = "shellcheck $(shfmt --find .)"
